name: Coordinator Voice Safety
on:
  push:
    branches: [feature/voice-menu-control-v1, 'fix/sha-only-coordinator-*', 'feat/coordinator-keys-in-master-admin-*', 'feat/shaurmeg-local-dialogue-*', 'feat/human-menu-identifiers-*']
  pull_request:
    paths:
      - 'v2/backend/src/coordinator-*'
      - 'v2/backend/test/coordinator-dialogue.test.js'
      - 'v2/backend/test/coordinator-human-identifiers.test.js'
      - 'v2/backend/test/coordinator-name-commands.test.js'
      - 'v2/backend/src/menu-coordinator.js'
      - 'backend/master-admin.html'
      - 'backend/server.js'
      - 'v2/backend/test/master-coordinator-key-contract.test.js'
      - 'v2/backend/test/coordinator-language.test.js'
      - 'v2/backend/test/coordinator-shaurmeg-language.test.js'
      - 'v2/backend/test/coordinator-sha-only.test.js'
      - 'v2/frontend/coordinator-console.html'
      - 'v2/frontend/admin-coordinator.html'
      - '.github/workflows/coordinator-voice-safety.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v2/backend/src/coordinator-language.js
          node --check v2/backend/src/coordinator-shaurmeg-language.js
          node --check v2/backend/src/coordinator-dialogue.js
          node --check v2/backend/src/coordinator-bot.js
          node --check v2/backend/src/menu-coordinator.js
          node --check backend/server.js
      - name: Russian menu resolution and isolation
        run: node --test v2/backend/test/coordinator-language.test.js v2/backend/test/coordinator-shaurmeg-language.test.js v2/backend/test/coordinator-sha-only.test.js v2/backend/test/coordinator-dialogue.test.js v2/backend/test/coordinator-human-identifiers.test.js v2/backend/test/coordinator-name-commands.test.js v2/backend/test/coordinator-webapp-syntax.test.js v2/backend/test/master-coordinator-key-contract.test.js
      - name: Menu coordinator contracts
        run: |
          cd v2/backend
          npm install --ignore-scripts --no-audit --no-fund
          node --test test/menu-coordinator-contract.test.js
