name: realcity-gpu-image

on:
  pull_request:
    paths:
      - "v2/reconstruction-worker/**"
      - ".github/workflows/realcity-gpu-image.yml"
  push:
    branches: [main]
    paths:
      - "v2/reconstruction-worker/**"
      - ".github/workflows/realcity-gpu-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build GPU worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: v2/reconstruction-worker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/shaurma-city-realcity-gpu:latest
            ghcr.io/${{ github.repository_owner }}/shaurma-city-realcity-gpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
