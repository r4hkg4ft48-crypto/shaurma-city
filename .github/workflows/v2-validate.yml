name: v2-validate

on:
  push:
    branches: [shaurmeg-v2-clean, v2-telegram-cutover, v2-telegram-rate-limit-fix]
  pull_request:
    paths:
      - "v2/**"
      - "backend/**"
      - ".github/workflows/v2-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          find v2 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check backend/server.js
          node --check backend/venue-owner.js
      - name: Inline JS · Master Admin
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,tempfile,sys
          filename='backend/master-admin.html'
          text=pathlib.Path(filename).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as tmp:
                  tmp.write(script)
                  path=tmp.name
              result=subprocess.run(['node','--check',path],capture_output=True,text=True)
              pathlib.Path(path).unlink(missing_ok=True)
              if result.returncode:
                  print(filename,'script',i)
                  print(result.stderr)
                  sys.exit(result.returncode)
          PY
      - name: Inline JS · Venue Owner
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,tempfile,sys
          filename='backend/venue-owner.html'
          text=pathlib.Path(filename).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as tmp:
                  tmp.write(script)
                  path=tmp.name
              result=subprocess.run(['node','--check',path],capture_output=True,text=True)
              pathlib.Path(path).unlink(missing_ok=True)
              if result.returncode:
                  print(filename,'script',i)
                  print(result.stderr)
                  sys.exit(result.returncode)
          PY
      - name: Inline JS · Orders/Menu Admin
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,tempfile,sys
          filename='backend/shaurma-owner.html'
          text=pathlib.Path(filename).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as tmp:
                  tmp.write(script)
                  path=tmp.name
              result=subprocess.run(['node','--check',path],capture_output=True,text=True)
              pathlib.Path(path).unlink(missing_ok=True)
              if result.returncode:
                  print(filename,'script',i)
                  print(result.stderr)
                  sys.exit(result.returncode)
          PY
      - name: Inline JS · Map/RealCity Admin
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,tempfile,sys
          filename='backend/shaurmeg-owner.html'
          text=pathlib.Path(filename).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as tmp:
                  tmp.write(script)
                  path=tmp.name
              result=subprocess.run(['node','--check',path],capture_output=True,text=True)
              pathlib.Path(path).unlink(missing_ok=True)
              if result.returncode:
                  print(filename,'script',i)
                  print(result.stderr)
                  sys.exit(result.returncode)
          PY
      - name: Builder domain behavior
        run: |
          node - <<'NODE'
          const D=require('./v2/backend/src/domain');
          const cfg=D.normalizeBuilderConfig({
            title:'Test',
            types:[{id:'base',name:'Base',price:100}],
            breads:[],
            meats:[],
            sauces:[],
            extras:[],
            min_sauces:0,
            max_sauces:0,
            max_extras:0
          });
          if(cfg.breads.length||cfg.meats.length||cfg.sauces.length||cfg.extras.length)throw new Error('explicit empty groups were repopulated');
          if(cfg.types.length!==1||cfg.types[0].id!=='base')throw new Error('product type normalization failed');
          const built=D.priceBuilder({builder_enabled:true,builder:cfg},{type:'base',bread:'',meat:'',sauces:[],extras:[]});
          if(!built||built.p!==100)throw new Error('builder price validation failed');
          const custom=D.normalizeBuilderConfig({
            types:[{id:'wrap',name:'Wrap',price:250}],
            sauces:[{id:'hot',name:'Hot',price:25}],
            extras:[{id:'cheese',name:'Cheese',price:40}],
            min_sauces:1,max_sauces:1,max_extras:1,
            breads:[],meats:[]
          });
          const priced=D.priceBuilder({builder_enabled:true,builder:custom},{type:'wrap',sauces:['hot'],extras:['cheese']});
          if(!priced||priced.p!==315)throw new Error('custom ingredient pricing failed');
          console.log('builder domain behavior ok');
          NODE
      - name: Install API dependencies
        working-directory: v2/backend
        run: npm install --ignore-scripts
      - name: Install production adapter dependencies
        working-directory: backend
        run: npm install --ignore-scripts
      - name: Load production adapter modules
        working-directory: backend
        run: node -e "require('../v2/backend/src/domain');require('../v2/backend/src/auth');require('../v2/backend/src/schema');require('../v2/backend/src/realtime');require('../v2/backend/src/realcity-service');require('../v2/backend/src/routes')"
      - name: Load API modules
        working-directory: v2/backend
        run: node -e "require('./src/domain');require('./src/auth');require('./src/schema');require('./src/realtime');require('./src/realcity-service');require('./src/routes')"
      - name: Boot API and healthcheck
        working-directory: v2/backend
        run: |
          npm start >/tmp/shaurmeg-v2.log 2>&1 &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          for i in {1..12}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v2/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shaurmeg-v2.log
          exit 1
