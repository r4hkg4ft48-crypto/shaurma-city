<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f16">
<title>Shaurma City · Owner</title>
<style>
:root{--bg:#0a0f16;--p:#121923;--p2:#171f2a;--t:#f4f7fb;--m:#8f99a8;--l:rgba(255,255,255,.08);--b:#2f6df6;--b2:#173f9c;--g:#58d6a4;--y:#ffbf5b;--r:#ff6b78;--st:max(env(safe-area-inset-top),12px);--sb:max(env(safe-area-inset-bottom),12px)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--t);font:500 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;background:radial-gradient(circle at 15% -5%,rgba(47,109,246,.17),transparent 30%),linear-gradient(#0a0f16,#101720 60%,#0a0f16);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:calc(var(--st) + 10px) 14px calc(var(--sb) + 30px)}button,input,select,textarea{font:inherit;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:rgba(15,22,32,.84);border:1px solid var(--l);backdrop-filter:blur(16px);position:sticky;top:8px;z-index:10}.brand b{font-size:18px;letter-spacing:.03em}.brand small{display:block;color:var(--m);font-size:10px}.live{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(88,214,164,.08);border:1px solid rgba(88,214,164,.18);font-size:11px;color:#a9f4d5}.live i{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g)}h1{font-size:38px;line-height:.95;letter-spacing:-.04em;margin:26px 0 8px}.sub{color:var(--m);margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}.stat{padding:14px;border-radius:20px;background:linear-gradient(180deg,#131b26,#0d141d);border:1px solid var(--l)}.stat small{color:var(--m)}.stat b{display:block;font-size:26px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter{border:1px solid var(--l);background:rgba(255,255,255,.03);border-radius:999px;padding:9px 12px;color:var(--m)}.filter.active{color:white;border-color:rgba(47,109,246,.4);background:rgba(47,109,246,.08)}.orders{display:grid;gap:10px}.order{border:1px solid var(--l);border-radius:22px;background:linear-gradient(180deg,#121a25,#0b121b);overflow:hidden}.oh{display:flex;justify-content:space-between;gap:10px;padding:14px 14px 10px}.num{font-size:18px;font-weight:900}.time{color:var(--m);font-size:12px}.status{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850}.s-new{background:rgba(47,109,246,.12);color:#91adff}.s-cooking{background:rgba(255,191,91,.12);color:#ffd793}.s-ready{background:rgba(88,214,164,.12);color:#9af0cf}.s-done{background:rgba(255,255,255,.06);color:#aab3c0}.s-cancelled{background:rgba(255,107,120,.12);color:#ff9ca6}.body{padding:0 14px 14px}.customer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:3px 0 10px}.box{padding:10px 11px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid var(--l)}.box small{display:block;color:var(--m);font-size:10px}.items{display:grid;gap:6px;margin:10px 0}.item{display:flex;justify-content:space-between;gap:10px;color:#dfe6f2}.item small{color:var(--m)}.total{display:flex;justify-content:space-between;align-items:center;padding-top:11px;border-top:1px solid var(--l)}.total b{font-size:22px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.act{border:1px solid var(--l);background:rgba(255,255,255,.035);border-radius:13px;padding:9px 11px;font-weight:800}.act.primary{background:linear-gradient(135deg,#477fff,#1d4eb8);border:0}.act.good{background:rgba(88,214,164,.11);border-color:rgba(88,214,164,.18)}.act.danger{color:#ff9da6}.empty{padding:30px 16px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:20px}.menuAdmin{margin-top:28px;padding:18px;border:1px solid var(--l);border-radius:24px;background:linear-gradient(180deg,#121a25,#0b121b)}.menuHead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.menuHead h2{margin:0;font-size:25px}.menuControls{display:flex;gap:8px;flex-wrap:wrap}.menuControls select,.menuField{min-height:44px;border:1px solid var(--l);border-radius:12px;background:#0d151f;padding:9px 11px;outline:none}.menuControls button{border:0;border-radius:12px;background:#2f6df6;padding:10px 14px;font-weight:850}.menuRows{display:grid;gap:9px}.menuRow{display:grid;grid-template-columns:1.1fr .8fr 1.6fr 100px 42px;gap:7px;padding:9px;border:1px solid var(--l);border-radius:16px;background:rgba(255,255,255,.02)}.menuRow .removeItem{border:1px solid rgba(255,107,120,.2);border-radius:11px;background:rgba(255,107,120,.08);color:#ff9da6}.menuFoot{display:flex;gap:8px;margin-top:12px}.menuFoot button{min-height:43px;border-radius:12px;border:1px solid var(--l);background:rgba(255,255,255,.04);padding:0 14px;font-weight:800}.menuFoot .saveMenu{border:0;background:linear-gradient(135deg,#477fff,#1d4eb8)}.login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 30% 10%,rgba(47,109,246,.18),transparent 30%),#0a0f16;padding:18px}.loginCard{width:min(420px,100%);padding:20px;border-radius:26px;background:linear-gradient(180deg,#141c27,#0c131c);border:1px solid var(--l)}.loginCard h2{font-size:30px;line-height:1;margin:0 0 8px}.loginCard p{color:var(--m)}.loginCard input{width:100%;height:50px;border-radius:15px;border:1px solid var(--l);background:rgba(255,255,255,.035);padding:0 13px;outline:none}.loginCard button{width:100%;height:50px;border:0;border-radius:15px;margin-top:10px;background:linear-gradient(135deg,#477fff,#1d4eb8);font-weight:900}.err{color:#ff929d;font-size:12px;min-height:18px;margin-top:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;transition:.2s;z-index:70;padding:10px 13px;border-radius:13px;background:#101923;border:1px solid rgba(47,109,246,.25)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.customer{grid-template-columns:1fr}h1{font-size:34px}.menuHead{align-items:stretch;flex-direction:column}.menuControls{display:grid;grid-template-columns:1fr auto}.menuRow{grid-template-columns:1fr 1fr}.menuRow [data-field="d"]{grid-column:1/-1}.menuRow .removeItem{grid-column:2}}
 .topActions{display:flex;align-items:center;gap:8px}.mapAdminLink{padding:8px 11px;border:1px solid rgba(47,109,246,.25);border-radius:12px;color:#b7c8ff;text-decoration:none;font-size:11px;font-weight:850;background:rgba(47,109,246,.08)}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="wrap" id="app" hidden>
<header class="top"><div class="brand"><b>SHAURMA CITY</b><small>OWNER CONTROL</small></div><div class="topActions"><a class="mapAdminLink" href="/shaurmeg-owner">Редактор карты</a><div class="live"><i></i><span id="liveText">Онлайн</span></div></div></header>
<h1>Заказы<br>в реальном времени</h1>
<p class="sub">Новые заказы появляются здесь автоматически.</p>
<section class="stats"><div class="stat"><small>Сегодня</small><b id="stToday">0</b></div><div class="stat"><small>Новые</small><b id="stNew">0</b></div><div class="stat"><small>Готовятся</small><b id="stCook">0</b></div><div class="stat"><small>Выручка</small><b id="stRev">0 ₽</b></div></section>
<div class="toolbar" id="filters"><button class="filter active" data-f="all">Все</button><button class="filter" data-f="new">Новые</button><button class="filter" data-f="cooking">Готовятся</button><button class="filter" data-f="ready">Готовы</button><button class="filter" data-f="done">Выданы</button></div>
<div class="orders" id="orders"></div>
<section class="menuAdmin"><div class="menuHead"><div><small style="color:#799cff;font-weight:900;letter-spacing:.12em">МЕНЮ ЗАВЕДЕНИЙ</small><h2>Позиции и цены</h2></div><div class="menuControls"><select id="venueSelect" aria-label="Выбрать заведение"></select><button id="reloadVenue">Обновить</button></div></div><div class="menuRows" id="menuRows"></div><div class="menuFoot"><button id="addMenuItem">+ Добавить позицию</button><button class="saveMenu" id="saveMenu">Сохранить меню</button></div></section>
</div>
<div class="login" id="login"><div class="loginCard"><div style="color:#799cff;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:900">Shaurma City</div><h2>Кабинет владельца</h2><p>Введите пароль владельца, чтобы открыть живую ленту заказов.</p><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button id="loginBtn">Войти</button><div class="err" id="err"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const API=location.origin;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let token=sessionStorage.getItem('sc_owner_token')||'',adminSession=sessionStorage.getItem('sc_admin_tg_session')||'',orders=[],filter='all',stream=null,venues=[],editingVenue=null,menuDraft=[];
const labels={new:'Новый',cooking:'Готовится',ready:'Готов',done:'Выдан',cancelled:'Отменён'};
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),1300)}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(adminSession)opt.headers.Authorization='Bearer '+adminSession;else opt.headers['X-Owner-Token']=token;if(!opt.method||opt.method==='GET'){opt.cache='no-store';path+=(path.includes('?')?'&':'?')+'t='+Date.now()}const r=await fetch(API+path,opt);if(r.status===401){logout();throw new Error('unauthorized')}if(!r.ok)throw new Error(await r.text());return r.json()}
async function login(){const password=$('#password').value.trim();$('#err').textContent='';try{const r=await fetch(API+'/api/shaurma/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!r.ok)throw new Error();const j=await r.json();token=j.token;sessionStorage.setItem('sc_owner_token',token);start()}catch{$('#err').textContent='Неверный пароль'}}
function logout(){sessionStorage.removeItem('sc_owner_token');sessionStorage.removeItem('sc_admin_tg_session');token='';adminSession='';$('#app').hidden=true;$('#login').style.display='grid';stream?.close()}
async function start(){try{await Promise.all([load(),loadVenues()]);$('#login').style.display='none';$('#app').hidden=false;connect()}catch(e){if(token)$('#err').textContent='Не удалось подключиться'}}
async function load(){orders=await api('/api/shaurma/orders');render();stats()}
async function loadVenues(){venues=await api('/api/shaurma/venues');$('#venueSelect').innerHTML=venues.map(v=>`<option value="${v.venue_id}">${escapeHtml(v.name)}</option>`).join('');if(venues.length)await openVenue($('#venueSelect').value||venues[0].venue_id)}
async function openVenue(id){editingVenue=await api('/api/shaurma/venues/'+encodeURIComponent(id));menuDraft=Array.isArray(editingVenue.menu)?editingVenue.menu.map(x=>({...x})):[];renderMenuEditor()}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMenuEditor(){const cats={shawarma:'Шаурма',flatbread:'Лепёшка / тарелка',extras:'Допы',drinks:'Напитки',bakery:'Выпечка',sauces:'Соусы'};$('#menuRows').innerHTML=menuDraft.length?menuDraft.map((x,i)=>`<div class="menuRow" data-index="${i}"><input class="menuField" data-field="n" value="${escapeHtml(x.n||x.name||'')}" placeholder="Название"><select class="menuField" data-field="c">${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${String(x.c||x.category)===k?'selected':''}>${v}</option>`).join('')}</select><input class="menuField" data-field="d" value="${escapeHtml(x.d||x.description||'')}" placeholder="Описание"><input class="menuField" data-field="p" type="number" min="0" value="${Number(x.p??x.price??0)}" placeholder="Цена"><button class="removeItem" data-remove-item="${i}" aria-label="Удалить">×</button></div>`).join(''):'<div class="empty">В меню пока нет позиций</div>'}
async function saveVenueMenu(){if(!editingVenue)return;const button=$('#saveMenu');button.disabled=true;try{const venueId=editingVenue.venue_id;await api('/api/shaurma/venues/'+encodeURIComponent(venueId),{method:'PUT',body:JSON.stringify({slug:editingVenue.slug,name:editingVenue.name,is_active:editingVenue.is_active,config:editingVenue.config||{},menu:menuDraft})});await openVenue(venueId);toast('Меню сохранено и обновлено')}catch(e){toast('Не удалось сохранить меню')}finally{button.disabled=false}}
async function stats(){const s=await api('/api/shaurma/stats');$('#stToday').textContent=s.today;$('#stNew').textContent=s.new;$('#stCook').textContent=s.cooking;$('#stRev').textContent=s.revenue+' ₽'}
function connect(){stream?.close();const q=adminSession?'admin_session='+encodeURIComponent(adminSession):'token='+encodeURIComponent(token);stream=new EventSource(API+'/api/shaurma/stream?'+q);stream.addEventListener('ready',()=>{$('#liveText').textContent='Онлайн'});stream.addEventListener('order',e=>{const o=JSON.parse(e.data);orders=[o,...orders.filter(x=>String(x.id)!==String(o.id))];render();stats();toast('Новый заказ '+o.order_number)});stream.addEventListener('update',e=>{const o=JSON.parse(e.data);orders=orders.map(x=>String(x.id)===String(o.id)?o:x);render();stats()});stream.onerror=()=>{$('#liveText').textContent='Переподключение…'}}
function itemName(x){return x.n||x.name||'Позиция'}
function render(){const list=filter==='all'?orders:orders.filter(x=>x.status===filter);$('#orders').innerHTML=list.length?list.map(o=>{const d=new Date(o.created_at);const items=Array.isArray(o.items)?o.items:[];return `<article class="order"><div class="oh"><div><div class="num">${o.order_number}</div><div class="time">${escapeHtml(o.venue_name||'Заведение')} · ${d.toLocaleString('ru-RU')}</div></div><span class="status s-${o.status}">${labels[o.status]||o.status}</span></div><div class="body"><div class="customer"><div class="box"><small>Клиент</small><b>${escapeHtml(o.customer_name||'Гость')}</b><br><span>${escapeHtml(o.phone||'—')}</span></div><div class="box"><small>Адрес</small><b>${escapeHtml(o.address||'Самовывоз / не указан')}</b>${o.comment?'<br><span>'+escapeHtml(o.comment)+'</span>':''}</div></div><div class="items">${items.map(x=>'<div class="item"><span>'+escapeHtml(itemName(x))+' × '+(x.q||1)+'<small>'+escapeHtml(x.detail||'')+'</small></span><b>'+((Number(x.p)||0)*(x.q||1))+' ₽</b></div>').join('')}</div><div class="total"><span>Итого</span><b>${Number(o.total)||0} ₽</b></div><div class="actions">${o.status==='new'?'<button class="act primary" data-id="'+o.id+'" data-status="cooking">Принять → готовится</button>':''}${o.status==='cooking'?'<button class="act good" data-id="'+o.id+'" data-status="ready">Готов</button>':''}${o.status==='ready'?'<button class="act primary" data-id="'+o.id+'" data-status="done">Выдан</button>':''}${!['done','cancelled'].includes(o.status)?'<button class="act danger" data-id="'+o.id+'" data-status="cancelled">Отменить</button>':''}</div></div></article>`}).join(''):'<div class="empty">Заказов в этом разделе пока нет</div>'}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-status]');if(b){b.disabled=true;try{await api('/api/shaurma/orders/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});await load()}catch{toast('Не удалось изменить статус')}finally{b.disabled=false}}const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;$$('.filter').forEach(x=>x.classList.toggle('active',x===f));render()}});
$('#venueSelect').addEventListener('change',e=>openVenue(e.target.value));
$('#reloadVenue').onclick=()=>openVenue($('#venueSelect').value);
$('#addMenuItem').onclick=()=>{if(!editingVenue)return;menuDraft.push({id:editingVenue.venue_id+'_'+Date.now().toString(36),n:'Новая позиция',c:'shawarma',d:'',p:0});renderMenuEditor()};
$('#saveMenu').onclick=saveVenueMenu;
$('#menuRows').addEventListener('input',e=>{const row=e.target.closest('[data-index]');if(!row||!e.target.dataset.field)return;const item=menuDraft[Number(row.dataset.index)];if(!item)return;const field=e.target.dataset.field;item[field]=field==='p'?Math.max(0,Number(e.target.value)||0):e.target.value});
$('#menuRows').addEventListener('click',e=>{const button=e.target.closest('[data-remove-item]');if(!button)return;menuDraft.splice(Number(button.dataset.removeItem),1);renderMenuEditor()});
async function telegramAdminLogin(){
 const tg=window.Telegram&&window.Telegram.WebApp;
 if(!tg||!tg.initData)return false;
 try{
  tg.ready();tg.expand();
  const r=await fetch(API+'/api/shaurma/admin-telegram-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData})});
  if(r.status===403){const j=await r.json().catch(()=>({}));$('#err').textContent='Telegram-доступ не настроен'+(j.user_id?' · ID '+j.user_id:'')+'. Войдите по паролю ниже.';$('#login').style.display='grid';return false}
  if(!r.ok)throw new Error('auth');
  const j=await r.json();adminSession=j.session;sessionStorage.setItem('sc_admin_tg_session',adminSession);
  $('#liveText').textContent='Telegram · '+(j.user.first_name||j.user.username||j.user.id);
  await start();return true;
 }catch(e){$('#err').textContent='Не удалось войти через Telegram';return false}
}
$('#loginBtn').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
(async()=>{if(adminSession||token){await start();return}const ok=await telegramAdminLogin();if(!ok)$('#login').style.display='grid'})();

</script>
</body></html>
