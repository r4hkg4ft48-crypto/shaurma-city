<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15120d"><title>шаурмег · редактор карты</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><style>
:root{--ink:#17120c;--paper:#fffaf0;--yellow:#ffc529;--line:rgba(23,18,12,.12);--muted:#786f63;--red:#c83c32;--shadow:0 24px 70px rgba(27,20,10,.2)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eee8dc;color:var(--ink);font:500 15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{height:100%;display:grid;grid-template-rows:72px minmax(0,1fr)}header{z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;background:rgba(255,250,240,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:950;letter-spacing:-.05em}.brand i{width:32px;height:32px;display:grid;place-items:center;border-radius:11px;background:var(--yellow);font-style:normal}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em}.headerActions{display:flex;gap:8px}.headerActions button,.ghost{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:800}.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}.mapWrap{position:relative;min-width:0}#map{position:absolute;inset:0}.sidebar{z-index:3;min-height:0;display:flex;flex-direction:column;background:var(--paper);border-left:1px solid var(--line)}.sideHead{padding:18px;border-bottom:1px solid var(--line)}.sideHead h1{margin:0;font-size:22px;letter-spacing:-.04em}.sideHead p{margin:7px 0 0;color:var(--muted);font-size:13px}.list{overflow:auto;padding:10px}.place{width:100%;display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid transparent;border-radius:16px;background:transparent;text-align:left}.place:hover{border-color:var(--line);background:#fff}.placeIcon{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:#ffe397;font-size:23px}.place b,.place small{display:block}.place small{color:var(--muted);margin-top:2px}.place em{width:8px;height:8px;border-radius:50%;background:#28a56b}.place em.off{background:#b9b1a4}.empty{padding:32px 16px;text-align:center;color:var(--muted)}.holdState{position:absolute;z-index:4;left:50%;bottom:24px;translate:-50% 10px;display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:16px;background:rgba(23,18,12,.9);color:#fff;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.holdState.show{opacity:1;translate:-50% 0}.holdRing{width:25px;height:25px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--yellow);border-radius:50%;animation:spin 1s linear infinite}.addPrompt{position:absolute;z-index:5;left:50%;bottom:24px;translate:-50% 16px;width:min(390px,calc(100% - 28px));padding:14px;border:1px solid rgba(255,255,255,.7);border-radius:22px;background:rgba(255,250,240,.97);box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:.25s}.addPrompt.show{opacity:1;visibility:visible;translate:-50% 0}.addPrompt b,.addPrompt small{display:block}.addPrompt small{margin:3px 0 12px;color:var(--muted)}.primary{min-height:46px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:900}.addPrompt .primary{width:100%}.modal{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:16px;background:rgba(16,12,8,.55);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:.2s}.modal.open{opacity:1;visibility:visible}.panel{width:min(720px,100%);max-height:min(90vh,820px);overflow:auto;border-radius:26px;background:var(--paper);box-shadow:var(--shadow)}.panelHead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);background:rgba(255,250,240,.96);backdrop-filter:blur(15px)}.panelHead h2{margin:0;font-size:24px;letter-spacing:-.04em}.close{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:850}.field input,.field textarea,.field select{width:100%;min-height:47px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;outline:none}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#c99000;box-shadow:0 0 0 3px rgba(255,197,41,.18)}.photoDrop{position:relative;min-height:150px;display:grid;place-items:center;overflow:hidden;border:1px dashed #bea652;border-radius:18px;background:#fff3cb;text-align:center}.photoDrop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.photoDrop.has img{display:block}.photoDrop.has .photoText{position:relative;z-index:1;padding:8px 11px;border-radius:999px;background:rgba(23,18,12,.75);color:#fff}.photoDrop input{position:absolute;inset:0;opacity:0;cursor:pointer}.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px}.switch{display:flex;align-items:center;gap:9px}.switch input{width:20px;height:20px}.formActions{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;padding-top:3px}.formActions .primary{padding:0 20px}.danger{min-height:46px;padding:0 14px;border:1px solid rgba(200,60,50,.22);border-radius:14px;background:rgba(200,60,50,.07);color:var(--red);font-weight:850}.login{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 30% 10%,rgba(255,197,41,.25),transparent 33%),#17120c}.loginCard{width:min(410px,100%);padding:22px;border-radius:26px;background:var(--paper)}.loginCard h2{margin:0 0 8px;font-size:30px;letter-spacing:-.05em}.loginCard p{color:var(--muted)}.loginCard input{width:100%;height:50px;border:1px solid var(--line);border-radius:15px;padding:0 13px}.loginCard button{width:100%;margin-top:10px}.error{min-height:20px;margin-top:8px;color:var(--red);font-size:13px}.maplibregl-marker{cursor:pointer}.shawarmaMarker{width:48px;height:48px;display:grid;place-items:center;border:3px solid #fff;border-radius:18px 18px 18px 5px;background:var(--yellow);box-shadow:0 8px 22px rgba(23,18,12,.3);font-size:25px;transform:rotate(-8deg)}.draftMarker{filter:grayscale(1);opacity:.8}@keyframes spin{to{rotate:360deg}}@media(max-width:780px){.shell{grid-template-rows:66px minmax(0,1fr)}header{padding:10px 13px}.brand{font-size:19px}.brand small{display:none}.workspace{grid-template-columns:1fr}.sidebar{position:absolute;z-index:6;right:9px;top:78px;width:52px;max-height:52px;overflow:hidden;border:0;border-radius:17px;box-shadow:var(--shadow)}.sidebar.open{left:9px;width:auto;max-height:45vh}.sideHead{padding:13px}.sidebar:not(.open) .sideHead>*{display:none}.sidebar:not(.open) .sideHead:after{content:'☰';display:grid;place-items:center;width:26px;height:26px;font-size:20px}.list{display:none}.sidebar.open .list{display:block}.form{grid-template-columns:1fr;padding:15px}.field.full,.formActions{grid-column:1}.formActions{flex-wrap:wrap}.panel{max-height:94vh}.holdState,.addPrompt{bottom:14px}}
</style><style>.galleryPreview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.galleryPreview:empty{display:none}.galleryPreview span{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:13px;background:#eee}.galleryPreview img{width:100%;height:100%;object-fit:cover}.galleryPreview button{position:absolute;top:5px;right:5px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(23,18,12,.8);color:#fff}</style></head><body><div class="shell" id="app" hidden><header><div class="brand"><i>🥙</i><div>шаурмег<small>РЕДАКТОР КАРТЫ</small></div></div><div class="headerActions"><button id="reload">Обновить</button><button id="logout">Выйти</button></div></header><div class="workspace"><div class="mapWrap"><div id="map"></div><div class="holdState" id="holdState"><span class="holdRing"></span><span>Удерживайте 3 секунды</span></div><div class="addPrompt" id="addPrompt"><b>Добавить точку здесь?</b><small id="draftAddress">Определяем адрес…</small><button class="primary" id="confirmAdd">＋ Добавить метку шаурмы</button></div></div><aside class="sidebar" id="sidebar"><div class="sideHead"><h1>Точки на карте</h1><p>Удерживайте нужный дом на карте 3 секунды.</p></div><div class="list" id="list"></div></aside></div></div>
<div class="login" id="login"><div class="loginCard"><h2>Редактор шаурмег</h2><p>Добавлять и изменять заведения может только владелец карты.</p><input id="password" type="password" placeholder="Пароль владельца" autocomplete="current-password"><button class="primary" id="loginButton">Войти</button><div class="error" id="loginError"></div></div></div>
<div class="modal" id="modal"><div class="panel"><div class="panelHead"><h2 id="modalTitle">Новая точка</h2><button class="close" id="closeModal">×</button></div><form class="form" id="markerForm"><div class="field full"><label>Связанное заведение и меню в Mini App</label><select id="venueId" required></select></div><div class="field"><label>Название точки</label><input id="name" required maxlength="160" placeholder="Например, В Лепёшке"></div><div class="field"><label>Адрес</label><input id="address" maxlength="300" placeholder="Улица и дом"></div><div class="field full"><label>Короткое описание</label><textarea id="description" maxlength="1400" placeholder="Главное о кафе, кухне и атмосфере"></textarea></div><div class="field full"><label>Фоновое фото карточки</label><div class="photoDrop" id="photoDrop"><img id="photoPreview" alt="Предпросмотр"><span class="photoText">Нажмите, чтобы выбрать фотографию</span><input id="photoFile" type="file" accept="image/*"></div></div><div class="field full"><label>Фотографии галереи — до 3</label><input id="galleryFiles" type="file" accept="image/*" multiple><div class="galleryPreview" id="galleryPreview"></div></div><div class="field"><label>Часы работы</label><input id="hours" maxlength="160" placeholder="Ежедневно 10:00–23:00"></div><div class="field"><label>Средний чек</label><input id="priceLabel" maxlength="80" placeholder="≈ 450 ₽"></div><div class="field full"><label>Координаты</label><div class="coords"><input id="lat" type="number" step="any" required><input id="lon" type="number" step="any" required></div></div><label class="switch field full"><input id="isActive" type="checkbox" checked> Показывать точку пользователям</label><div class="formActions"><button class="danger" id="deleteMarker" type="button" hidden>Удалить метку</button><button class="primary" id="saveMarker" type="submit">Сохранить точку</button></div></form></div></div>
<script>
const API=location.origin,$=s=>document.querySelector(s);let token=sessionStorage.getItem('shaurmeg_owner_token')||'',map,venues=[],markers=[],mapMarkers=new Map(),editingId=null,draft=null,draftMapMarker=null,holdTimer=null,holdStarted=false,ignoreNextMapClick=false,heroImage='',galleryImages=[];
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-Owner-Token':token};const r=await fetch(API+path,opt);if(r.status===401){logout();throw new Error('unauthorized')}if(!r.ok)throw new Error(await r.text());return r.json()}
async function login(){const password=$('#password').value.trim();$('#loginError').textContent='';try{const r=await fetch(API+'/api/shaurma/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!r.ok)throw new Error();const j=await r.json();token=j.token;sessionStorage.setItem('shaurmeg_owner_token',token);await start()}catch{$('#loginError').textContent='Неверный пароль или сервер недоступен'}}
function logout(){sessionStorage.removeItem('shaurmeg_owner_token');token='';$('#app').hidden=true;$('#login').style.display='grid'}
async function start(){if(!map)initMap();await Promise.all([loadVenues(),loadMarkers()]);$('#login').style.display='none';$('#app').hidden=false;setTimeout(()=>map.resize(),60)}
function initMap(){map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[37.6176,55.7558],zoom:11,maxZoom:19});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-left');map.on('mousedown',e=>beginHold(e.lngLat));map.on('touchstart',e=>beginHold(e.lngLat));['mouseup','touchend','dragstart','zoomstart','rotatestart'].forEach(event=>map.on(event,cancelHold));map.on('click',()=>{if(ignoreNextMapClick){ignoreNextMapClick=false;return}$('#addPrompt').classList.remove('show')})}
function beginHold(lngLat){cancelHold();holdStarted=true;$('#holdState').classList.add('show');holdTimer=setTimeout(()=>completeHold(lngLat),3000)}
function cancelHold(){clearTimeout(holdTimer);holdTimer=null;if(holdStarted)$('#holdState').classList.remove('show');holdStarted=false}
async function completeHold(lngLat){cancelHold();ignoreNextMapClick=true;draft={lat:lngLat.lat,lon:lngLat.lng,address:''};if(draftMapMarker)draftMapMarker.remove();const el=document.createElement('div');el.className='shawarmaMarker draftMarker';el.textContent='＋';draftMapMarker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([draft.lon,draft.lat]).addTo(map);$('#draftAddress').textContent='Определяем адрес…';$('#addPrompt').classList.add('show');try{const u=new URL('https://nominatim.openstreetmap.org/reverse');u.search=new URLSearchParams({format:'jsonv2',lat:draft.lat,lon:draft.lon,zoom:'18','accept-language':'ru'});const r=await fetch(u);const j=await r.json();draft.address=j.display_name||'';$('#draftAddress').textContent=draft.address||`${draft.lat.toFixed(6)}, ${draft.lon.toFixed(6)}`}catch{$('#draftAddress').textContent=`${draft.lat.toFixed(6)}, ${draft.lon.toFixed(6)}`}}
async function loadVenues(){venues=await api('/api/shaurma/venues');$('#venueId').innerHTML=venues.map(v=>`<option value="${v.venue_id}">${escapeHtml(v.name)}</option>`).join('')}
async function loadMarkers(){markers=await api('/api/shaurmeg/admin/markers?t='+Date.now());renderMarkers();renderList()}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMarkers(){for(const marker of mapMarkers.values())marker.remove();mapMarkers.clear();for(const item of markers){const el=document.createElement('div');el.className='shawarmaMarker';el.textContent='🥙';const marker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([item.lon,item.lat]).addTo(map);el.addEventListener('click',e=>{e.stopPropagation();openEdit(item)});mapMarkers.set(String(item.id),marker)}}
function renderList(){$('#list').innerHTML=markers.length?markers.map(x=>`<button class="place" data-id="${x.id}"><span class="placeIcon">🥙</span><span><b>${escapeHtml(x.name)}</b><small>${escapeHtml(x.address||x.venue_id)}</small></span><em class="${x.is_active?'':'off'}"></em></button>`).join(''):'<div class="empty">Карта пока чистая.<br>Удерживайте нужный дом 3 секунды.</div>';document.querySelectorAll('.place').forEach(b=>b.onclick=()=>{const x=markers.find(v=>String(v.id)===b.dataset.id);if(x){map.flyTo({center:[x.lon,x.lat],zoom:16});openEdit(x)}})}
function renderGallery(){$('#galleryPreview').innerHTML=galleryImages.map((src,i)=>`<span><img src="${src}" alt="Фото ${i+1}"><button type="button" data-remove-gallery="${i}" aria-label="Удалить">×</button></span>`).join('')}
function resetForm(){editingId=null;heroImage='';galleryImages=[];$('#markerForm').reset();$('#isActive').checked=true;$('#photoDrop').classList.remove('has');$('#photoPreview').removeAttribute('src');renderGallery();$('#deleteMarker').hidden=true;$('#modalTitle').textContent='Новая точка'}
function openNew(){if(!draft)return;resetForm();$('#lat').value=draft.lat;$('#lon').value=draft.lon;$('#address').value=draft.address||'';$('#venueId').value=venues[0]?.venue_id||'';$('#name').value=venues[0]?.name||'';$('#modal').classList.add('open')}
function openEdit(item){resetForm();editingId=item.id;$('#modalTitle').textContent='Карточка заведения';$('#venueId').value=item.venue_id;$('#name').value=item.name;$('#address').value=item.address||'';$('#description').value=item.description||'';$('#lat').value=item.lat;$('#lon').value=item.lon;$('#hours').value=item.hours||'';$('#priceLabel').value=item.price_label||'';$('#isActive').checked=item.is_active!==false;heroImage=item.hero_image||'';galleryImages=Array.isArray(item.gallery)?item.gallery.slice(0,3):[];renderGallery();if(heroImage){$('#photoPreview').src=heroImage;$('#photoDrop').classList.add('has')}$('#deleteMarker').hidden=false;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
async function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const maxW=1600,maxH=1000,scale=Math.min(1,maxW/img.width,maxH/img.height),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
async function saveMarker(e){e.preventDefault();const body={venue_id:$('#venueId').value,name:$('#name').value,address:$('#address').value,description:$('#description').value,lat:Number($('#lat').value),lon:Number($('#lon').value),hero_image:heroImage,gallery:galleryImages,hours:$('#hours').value,price_label:$('#priceLabel').value,is_active:$('#isActive').checked};$('#saveMarker').disabled=true;try{await api('/api/shaurmeg/admin/markers'+(editingId?'/'+editingId:''),{method:editingId?'PUT':'POST',body:JSON.stringify(body)});closeModal();$('#addPrompt').classList.remove('show');draftMapMarker?.remove();draftMapMarker=null;draft=null;await loadMarkers()}catch{alert('Не удалось сохранить точку. Проверьте заполнение и связь с заведением.')}finally{$('#saveMarker').disabled=false}}
$('#loginButton').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#logout').onclick=logout;$('#reload').onclick=()=>loadMarkers();$('#confirmAdd').onclick=openNew;$('#closeModal').onclick=closeModal;$('#markerForm').onsubmit=saveMarker;$('#venueId').onchange=()=>{if(!editingId){const v=venues.find(x=>x.venue_id===$('#venueId').value);if(v)$('#name').value=v.name}};$('#photoFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;heroImage=await compressImage(file);$('#photoPreview').src=heroImage;$('#photoDrop').classList.add('has')};$('#galleryFiles').onchange=async e=>{const files=[...e.target.files].slice(0,3-galleryImages.length);for(const file of files)galleryImages.push(await compressImage(file));renderGallery();e.target.value=''};$('#galleryPreview').onclick=e=>{const b=e.target.closest('[data-remove-gallery]');if(!b)return;galleryImages.splice(Number(b.dataset.removeGallery),1);renderGallery()};$('#deleteMarker').onclick=async()=>{if(!editingId||!confirm('Удалить эту метку с карты?'))return;await api('/api/shaurmeg/admin/markers/'+editingId,{method:'DELETE'});closeModal();await loadMarkers()};$('#sidebar').onclick=e=>{if(innerWidth<=780&&!e.target.closest('.place'))$('#sidebar').classList.toggle('open')};if(token)start().catch(logout);
</script></body></html>
