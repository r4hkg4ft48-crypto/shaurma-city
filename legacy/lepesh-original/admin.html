<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeautyFlow Admin</title><style>
body{margin:0;background:#0b0b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial;padding:24px}main{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px}.tag{color:#aaa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card{background:#15141d;border:1px solid #292733;border-radius:20px;padding:18px}.num{font-size:28px;font-weight:800}.label{color:#aaa;font-size:12px;margin-top:5px}.booking{background:#15141d;border:1px solid #292733;border-radius:18px;padding:15px;margin:9px 0;display:flex;justify-content:space-between;gap:12px}.booking b{display:block}.booking small{color:#aaa}.status{color:#7ce8b5}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.booking{display:block}}
</style></head><body><main><div class="top"><div><h1>BeautyFlow Admin</h1><div class="tag">Кабинет владельца салона</div></div><div>✦</div></div><div class="grid"><div class="card"><div class="num" id="a">—</div><div class="label">Всего записей</div></div><div class="card"><div class="num" id="b">—</div><div class="label">Активных</div></div><div class="card"><div class="num" id="c">—</div><div class="label">Отмен</div></div><div class="card"><div class="num" id="d">—</div><div class="label">Потенц. выручка</div></div></div><h2>Последние записи</h2><div id="list"></div></main><script>
async function load(){const s=await fetch('/api/admin/stats').then(r=>r.json());a.textContent=s.bookings;b.textContent=s.active;c.textContent=s.cancelled;d.textContent=new Intl.NumberFormat('ru-RU').format(s.revenue)+' ₽';const x=await fetch('/api/bookings').then(r=>r.json());list.innerHTML=x.length?x.map(v=>'<div class="booking"><div><b>'+v.service_name+'</b><small>'+(v.client_name||'Гость')+' · '+v.booking_date+' · '+v.booking_time+'</small></div><span class="status">'+(v.status==='cancelled'?'Отменено':'Подтверждено')+'</span></div>').join(''):'<div class="tag">Записей пока нет</div>'}load();
</script></body></html>
