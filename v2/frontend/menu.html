<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f12">
<title>Шаурмег · меню</title><link rel="stylesheet" href="app.css"><script src="https://telegram.org/js/telegram-web-app.js"></script>
</head><body>
<header class="topbar glass"><button class="iconBtn" id="back">‹</button><div class="brand"><div><b id="topName">Меню</b><small id="topAddress">ЗАГРУЗКА</small></div></div><div class="grow"></div><button class="iconBtn" id="profileBtn">◉</button></header>
<main class="page">
  <section class="heroPanel" id="hero"><img id="heroImg" class="hidden" alt=""><div class="heroCopy"><span class="eyebrow">выбранная точка</span><h1 id="venueName">Загрузка…</h1><p id="venueMeta"></p></div></section>
  <section class="section"><div class="sectionHead"><div><small>МЕНЮ</small><h2>Выбери своё</h2></div><small id="menuCount"></small></div><div class="chips" id="chips"></div><div class="menuGrid" id="menuGrid"></div></section>
</main>
<button class="floatCart hidden" id="cartBtn"><span><span id="cartCount">0</span> · Корзина</span><b id="cartTotal">0 ₽</b></button>
<div class="sheetBackdrop" id="backdrop"></div>
<section class="sheet" id="cartSheet"><div class="sheetHandle"></div><div class="sheetHead"><h2>Корзина</h2><button class="iconBtn" data-close>×</button></div><div class="cartItems" id="cartItems"></div><div class="totalRow"><span>Итого</span><b id="sheetTotal">0 ₽</b></div><button class="primaryBtn" style="width:100%;min-height:52px" id="checkoutBtn">Продолжить</button></section>
<section class="sheet" id="checkoutSheet"><div class="sheetHandle"></div><div class="sheetHead"><h2>Получение</h2><button class="iconBtn" data-close>×</button></div>
  <div class="segment" id="fulfillment"><button class="active" data-value="cafe">В заведении</button><button data-value="delivery">Доставка</button></div>
  <div class="formGrid" style="margin-top:12px"><div class="field"><label>Имя</label><input id="customer" placeholder="Как к вам обращаться"></div><div class="field delivery hidden"><label>Телефон</label><input id="phone" inputmode="tel" placeholder="+7…"></div><div class="field delivery hidden"><label>Адрес доставки</label><input id="address" placeholder="Улица, дом, квартира"></div><div class="field"><label>Комментарий</label><textarea id="comment" placeholder="Пожелания к заказу"></textarea></div><div class="notice">Оплата в этой чистой версии пока фиксируется как «при получении». Данные карты приложение не хранит.</div></div>
  <button class="primaryBtn" style="width:100%;min-height:52px;margin-top:12px" id="placeOrder">Оформить заказ</button>
</section>
<section class="sheet" id="profileSheet"><div class="sheetHandle"></div><div class="sheetHead"><h2>Мои заказы</h2><button class="iconBtn" data-close>×</button></div><div id="myOrders" class="list"></div></section>
<div class="toast" id="toast"></div>
<script src="config.js"></script><script src="menu.js"></script>
</body></html>
